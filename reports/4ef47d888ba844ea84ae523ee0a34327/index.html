<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>샘플 판매 보고서</title><style>
*{box-sizing:border-box} body{margin:0;font-family:'Malgun Gothic','Segoe UI',sans-serif;font-size:14px;color:#1e293b;background:#f5f7fa}
header{padding:10px 16px;background:#26303d;color:#fff} header b{font-size:16px} header span{color:#b9c4d2;margin-left:12px;font-size:12px}
nav{display:flex;gap:2px;padding:8px 16px 0;background:#e6ebf1;border-bottom:1px solid #c5ced8;flex-wrap:wrap}
nav label{padding:6px 14px;cursor:pointer;border:1px solid #c5ced8;border-bottom:none;background:#f0f3f7;border-radius:6px 6px 0 0}
.tab{display:none} main{padding:14px 16px;overflow:auto}
.sheet{display:none} table{border-collapse:collapse;margin:0 0 18px;background:#fff;table-layout:fixed}
td{padding:4px 8px;border:1px solid #e1e6ec;vertical-align:middle;overflow:hidden;text-overflow:ellipsis} td a{color:#0b5cad;text-decoration:none;display:block}
td a:hover{text-decoration:underline} td.o{border:none} .note{color:#5c677d}
.fig{display:none;position:fixed;right:0;top:0;width:58%;height:100%;overflow:auto;background:#fff;border-left:2px solid #26303d;box-shadow:-6px 0 18px rgba(0,0,0,.25);padding:10px 14px;z-index:5}
.fig{width:var(--figw,58%)} .grip{position:fixed;top:0;bottom:0;width:12px;cursor:col-resize;z-index:6;touch-action:none;display:none;right:var(--figw,58%);margin-right:-6px}
.fig:target + .grip{display:block} .grip:hover,.grip.drag{background:rgba(38,48,61,.22)}
.fig:target{display:block} .fig h3{margin:4px 0 8px;font-size:14px} .fig img{max-width:100%;height:auto;border:1px solid #d6dce3}
.close{float:right;padding:3px 10px;border:1px solid #8a93a0;border-radius:4px;color:#1e293b;text-decoration:none;background:#f0f3f7}
button.save{padding:3px 10px;border:1px solid #8a93a0;border-radius:4px;background:#f0f3f7;color:#1e293b;cursor:pointer;font-size:13px;margin-right:6px}
button.save:hover{background:#e2e8f0} .bar{margin:0 0 10px} .fig .bar{margin:0 0 6px}
@media (max-width:900px){.fig{width:100%}.grip{display:none!important}} @media print{.bar{display:none}.grip{display:none!important}.fig{display:none!important}.sheet{display:block!important}nav{display:none}}

.tab{display:block;position:absolute;width:1px;height:1px;clip-path:inset(50%)}
a.save{display:inline-block;padding:3px 10px;border:1px solid #8a93a0;border-radius:4px;background:#f0f3f7;color:#1e293b;font-size:13px;text-decoration:none}
a.save:hover{background:#e2e8f0}
#t0:checked ~ main #s0{display:block} #t0:checked ~ nav label[for=t0]{background:#fff;font-weight:700;position:relative;top:1px} #t0:focus-visible ~ nav label[for=t0]{outline:2px solid #1965aa;outline-offset:-2px}#t1:checked ~ main #s1{display:block} #t1:checked ~ nav label[for=t1]{background:#fff;font-weight:700;position:relative;top:1px} #t1:focus-visible ~ nav label[for=t1]{outline:2px solid #1965aa;outline-offset:-2px}</style></head><body>
<header><b>샘플 판매 보고서</b><span>시트는 위쪽 탭에서 선택할 수 있습니다.</span></header>
<input class="tab" type="radio" name="sheet" id="t0" checked><input class="tab" type="radio" name="sheet" id="t1"><nav aria-label="시트"><label for="t0">요약</label><label for="t1">안내</label></nav><main>
<section class="sheet" id="s0"><h2>요약</h2><div class="bar"><button class="save" type="button" onclick="saveCsv(this)">이 시트 CSV로 저장 (엑셀에서 열기)</button><a class="save" href="original.xlsx" download="샘플 판매 보고서.xlsx">엑셀로 저장 (원본 · 전체 시트)</a></div><table style="width:192px"><colgroup><col style="width:64px"><col style="width:64px"><col style="width:64px"></colgroup><tr><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">품목</td><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">수량</td><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">금액</td></tr><tr><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">노트</td><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">12</td><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">36000</td></tr><tr><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">펜</td><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">8</td><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">12000</td></tr></table></section>
<section class="sheet" id="s1"><h2>안내</h2><div class="bar"><button class="save" type="button" onclick="saveCsv(this)">이 시트 CSV로 저장 (엑셀에서 열기)</button><a class="save" href="original.xlsx" download="샘플 판매 보고서.xlsx">엑셀로 저장 (원본 · 전체 시트)</a></div><table style="width:64px"><colgroup><col style="width:64px"></colgroup><tr><td style="font-size:15px;font-family:'Calibri','Malgun Gothic',sans-serif">이 페이지는 예시 데이터로 만든 게시 테스트입니다.</td></tr></table></section>
</main><script>
document.addEventListener("keydown",function(e){if(e.key==="Escape")location.hash="x";});
function download(name,href){var a=document.createElement("a");a.href=href;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);}
function safe(t){return String(t).replace(/[\\\/:*?"<>|\r\n]+/g,"_").replace(/^\s+|\s+$/g,"").slice(0,80)||"file";}
function figWidth(delta){var f=document.querySelector(".fig:target"),w=f?f.offsetWidth:window.innerWidth*.58;setFigWidth(w+delta);}
function setFigWidth(px){var w=Math.max(280,Math.min(window.innerWidth-40,Math.round(px)));document.documentElement.style.setProperty("--figw",w+"px");
  try{localStorage.setItem("figw",String(w));}catch(e){}return w;}
try{var savedFigWidth=parseInt(localStorage.getItem("figw"),10);if(savedFigWidth>0)setFigWidth(savedFigWidth);}catch(e){}
document.addEventListener("pointerdown",function(e){var grip=e.target.closest&&e.target.closest(".grip");if(!grip)return;e.preventDefault();grip.classList.add("drag");
  function move(ev){setFigWidth(window.innerWidth-ev.clientX);}
  function up(){grip.classList.remove("drag");document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);}
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);});
function saveImage(button){var box=button.closest(".fig");download(safe(box.querySelector("h3").textContent)+".png",box.querySelector("img").src);}
function saveFigures(button){var sheet=button.closest(".sheet"),seen={},ids=[],links=sheet.querySelectorAll('a[href^="#f"]');
  for(var i=0;i<links.length;i++){var id=links[i].getAttribute("href").slice(1);if(!seen[id]){seen[id]=1;ids.push(id);}}
  ids.forEach(function(id,n){setTimeout(function(){var box=document.getElementById(id);download(safe(box.querySelector("h3").textContent)+".png",box.querySelector("img").src);},n*400);});}
function tableRows(table){var grid=[],r,c;
  for(r=0;r<table.rows.length;r++){var row=table.rows[r];grid[r]=grid[r]||[];var col=0;
    for(c=0;c<row.cells.length;c++){var cell=row.cells[c];while(grid[r][col]!==undefined)col++;
      var rs=cell.rowSpan||1,cs=cell.colSpan||1;
      for(var i=0;i<rs;i++){grid[r+i]=grid[r+i]||[];for(var j=0;j<cs;j++)grid[r+i][col+j]=(i===0&&j===0)?cell.textContent.replace(/\s+$/,""):"";}
      col+=cs;}}
  return grid;}
function csvLine(row){return row.map(function(v){v=v===undefined?"":String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}
function saveCsv(button){var sheet=button.closest(".sheet"),tables=sheet.querySelectorAll("table"),lines=[];
  for(var t=0;t<tables.length;t++){if(t>0)lines.push("");tableRows(tables[t]).forEach(function(row){lines.push(csvLine(row));});}
  var blob=new Blob([String.fromCharCode(65279)+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob);
  download(safe(sheet.querySelector("h2").textContent)+".csv",url);setTimeout(function(){URL.revokeObjectURL(url);},2000);}
function saveXlsx(button){var text=document.getElementById("xlsxdata").textContent.replace(/\s+/g,""),raw=atob(text),bytes=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  var url=URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  download(safe(document.title)+".xlsx",url);setTimeout(function(){URL.revokeObjectURL(url);},2000);}
</script></body></html>
